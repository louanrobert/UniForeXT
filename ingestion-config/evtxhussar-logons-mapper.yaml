genericMappings:
  addTimestamp:
    - sourceField: "EventTime"
      type: dataProperty
      owlProperty: hasTimestamp
      dataType: xsd:dateTimeStamp

  addComputer:
    - type: linkedIndividual
      owlClass: Computer
      linkProperty: hasComputer
      identifier:
        fields: "Computer"
      dataProperties:
        - sourceField: "Computer"
          type: dataProperty
          owlProperty: hasHostname

  addUser:
    - type: linkedIndividual
      owlClass: User
      linkProperty: hasUser
      identifier:
        fields: "SubjectUserName"
      dataProperties:
        - sourceField: "SubjectUserName"
          type: dataProperty
          owlProperty: hasName
        - sourceField: "SubjectDomainName"
          type: dataProperty
          owlProperty: hasDomain
  
  addDescription:
    - sourceField: "Description"
      type: dataProperty
      owlProperty: hasDescription
  
  addEID:
    - sourceField: "EID"
      type: dataProperty
      owlProperty: hasEventID
      dataType: xsd:unsignedLong

mappers:
  - name: EvtxhussarLogonsMapper
    file: "${ANALYSIS_ROOT}/Evtxhussar_results/*/logons/logons.xlsx"
    owlClass: LogonEvent
    forensicTool: EvtxHussar
    identifier:
      fields:
        - "Computer"
        - "EventTime"
        - "TargetUserName"
        - "EID"
      separator: "_"
    generics:
      - addTimestamp
      - addComputer
      - addUser
      - addDescription
      - addEID
    fieldMappings:
      - type: linkedIndividual
        owlClass: LogonType
        linkProperty: hasLogonType
        identifier:
          fields: "LogonType"
        dataProperties:
          - sourceField: "LogonType"
            type: dataProperty
            owlProperty: hasName

      - sourceField: "LogonType (Use cases)"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "Logon type use case: "

      - sourceField: "Status"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "Status: "

      - sourceField: "SubStatus"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "Sub-status: "

      - sourceField: "LogonProcessName"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "Logon process: "

      - sourceField: "AuthenticationPackageName"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "Authentication package: "

      - type: linkedIndividual
        owlClass: Process
        linkProperty: hasProcess
        identifier:
          fields: "LogonProcessName"
        dataProperties:
          - sourceField: "LogonProcessName"
            type: dataProperty
            owlProperty: hasName
        nestedLinks:
            - type:  linkedIndividual
              owlClass: Path
              linkProperty: hasPath
              identifier:
                fields: "ProcessName"
              nestedLinks:
                - sourceField: "ProcessName"
                  type: dataProperty
                  owlProperty: hasContent

  - name: EvtxhussarRDPMapper
    file: "${ANALYSIS_ROOT}/Evtxhussar_results/*/rdp/rdp.xlsx"
    owlClass: RDPEvent
    forensicTool: EvtxHussar
    identifier:
      fields:
        - "Computer"
        - "EventTime"
        - "EID"
      separator: "_"
    generics:
      - addTimestamp
      - addComputer
      - addDescription
      - addEID
    fieldMappings:
      - sourceField: "SourceIP"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "SourceIP: "

      - sourceField: "Channel"
        type: dataProperty
        owlProperty: hasExtraInformation
        prefix: "Channel: "

      - sourceField: "Provider"
        type: dataProperty
        owlProperty: hasExtraInformation
        prefix: "Provider: "

  - name: EvtxhussarAccountRelatedOperationsMapper
    file: "${ANALYSIS_ROOT}/Evtxhussar_results/*/accounts/users_related_operations.xlsx"
    owlClass: AccountTampering
    forensicTool: EvtxHussar
    identifier:
      fields:
        - "Computer"
        - "EventTime"
        - "EID"
      separator: "_"
    generics:
      - addTimestamp
      - addComputer
      - addDescription
      - addEID
      - addUser
    fieldMappings:
      - sourceField: "Channel"
        type: dataProperty
        owlProperty: hasExtraInformation
        prefix: "Channel: "

      - sourceField: "Channel"
        type: dataProperty
        owlProperty: hasExtraInformation
        prefix: "Provider: "
      
      - type: linkedIndividual
        owlClass: User
        linkProperty: hasTargetUser
        identifier:
          fields: "TargetUserName"