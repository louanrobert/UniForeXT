genericMappings:
  addTimestamp:
    - sourceField: "EventTime"
      type: dataProperty
      owlProperty: hasTimestamp
      dataType: xsd:dateTimeStamp

  addComputer:
    - type: linkedIndividual
      owlClass: Computer
      linkProperty: hasComputer
      identifier:
        fields: "Computer"
      dataProperties:
        - sourceField: "Computer"
          type: dataProperty
          owlProperty: hasHostname

  addSubjectUser:
    - type: linkedIndividual
      owlClass: User
      linkProperty: hasUser
      identifier:
        fields: "SubjectUserName"
      dataProperties:
        - sourceField: "SubjectUserName"
          type: dataProperty
          owlProperty: hasName
        - sourceField: "SubjectDomainName"
          type: dataProperty
          owlProperty: hasDomain

  addTargetUser:
    - type: linkedIndividual
      owlClass: User
      linkProperty: hasTargetUser
      identifier:
        fields: "TargetUserName"
      dataProperties:
        - sourceField: "TargetUserName"
          type: dataProperty
          owlProperty: hasName
        - sourceField: "TargetDomainName"
          type: dataProperty
          owlProperty: hasDomain

  addDescription:
    - sourceField: "Description"
      type: dataProperty
      owlProperty: hasDescription
  
  addEID:
    - sourceField: "EID"
      type: dataProperty
      owlProperty: hasEventID
      dataType: xsd:unsignedLong

mappers:
  - name: EvtxHussarLogClearedMapper
    file: "${ANALYSIS_ROOT}/Evtxhussar_results/*/audit/log_cleared.xlsx"
    owlClass: LogCleared_Event
    forensicTool: EvtxHussar
    identifier:
      fields:
        - "Computer"
        - "EventTime"
        - "EID"
      separator: "_"
    generics:
      - addTimestamp
      - addComputer
      - addSubjectUser
      - addDescription
      - addEID
    fieldMappings:
      - sourceField: "Keywords"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "Keywords: "

  - name: EvtxHussarPolicyChangeMapper
    file: "${ANALYSIS_ROOT}/Evtxhussar_results/*/audit/policy_change.xlsx"
    owlClass: AuditPolicyChange_Event
    forensicTool: EvtxHussar
    identifier:
      fields:
        - "Computer"
        - "EventTime"
        - "EID"
      separator: "_"
    generics:
      - addTimestamp
      - addComputer
      - addSubjectUser
      - addTargetUser
    fieldMappings:
      - sourceField: "CategoryId"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "Category ID: "

      - sourceField: "SubcategoryId"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "Subcategory ID: "

      - sourceField: "SubcategoryGuid"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "Subcategory GUID: "

      - sourceField: "AuditPolicyChanges"
        type: dataProperty
        owlProperty: hasExtraInformation
        unique: false
        prefix: "Policy changes: "

  - name: EvtxHussarWindowsFirewallMapper
    file: "${ANALYSIS_ROOT}/Evtxhussar_results/*/firewall/windows_firewall.xlsx"
    owlClass: AuditPolicyChange_Event
    forensicTool: EvtxHussar
    identifier:
      fields:
        - "Computer"
        - "EventTime"
        - "EID"
      separator: "_"
    generics:
      - addTimestamp
      - addComputer
      - addDescription
      - addEID
    fieldMappings:
      - sourceField: "Channel"
        type: dataProperty
        owlProperty: hasExtraInformation
        prefix: "Channel: "

      - sourceField: "Provider"
        type: dataProperty
        owlProperty: hasExtraInformation
        prefix: "Provider: "

      - sourceField: "RuleName"
        type: dataProperty
        owlProperty: hasExtraInformation
        prefix: "RuleName"

      - type: linkedIndividual
        owlClass: Process
        linkProperty: hasProcess
        identifier:
          fields: "ModifyingApplication"
        dataProperties:
          - sourceField: "ModifyingApplication"
            type: dataProperty
            owlProperty: hasName
        nestedLinks:
            - type:  linkedIndividual
              owlClass: Path
              linkProperty: hasPath
              identifier:
                fields: "ModifyingApplication"
              nestedLinks:
                - sourceField: "ModifyingApplication"
                  type: dataProperty
                  owlProperty: hasContent