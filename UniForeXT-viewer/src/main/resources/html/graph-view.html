<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@latest/dist/css/core.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css" />
    <script src="assets/tailwindcss-cdn.js"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script src="assets/lucide.js"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>

<body class="antialiased bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden select-none">
    <div class="flex shrink-0 items-center gap-4 border-b border-white/10 bg-slate-900/80 px-6 py-4 backdrop-blur"
        id="toolbar">
        <h2 class="flex items-center gap-2 text-base font-semibold tracking-tight text-slate-50"><i
                data-lucide="share-2" class="w-[18px] h-[18px]"></i>
            Neighborhood Graph</h2>
        <button
            class="inline-flex items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-100 transition hover:border-white/20 hover:bg-white/10"
            onclick="fitGraph()">Fit View</button>
        <button
            class="inline-flex items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-100 transition hover:border-white/20 hover:bg-white/10"
            onclick="togglePhysics()">Toggle Physics</button>
        <button
            class="inline-flex items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-100 transition hover:border-white/20 hover:bg-white/10"
            onclick="resetGraph()">Reset</button>
        <span class="ml-auto text-xs text-slate-400" id="graph-stats"></span>
    </div>
    <div class="flex-1 relative" id="graph-wrapper">
        <div class="absolute inset-0 bg-muted/20" id="graph-container"></div>
        <div class="absolute top-2.5 right-2.5 bg-popover rounded-md text-xs z-20 pointer-events-auto overflow-hidden text-popover-foreground shadow-lg border border-border/15 w-fit min-w-[140px] max-w-[220px]"
            id="legend"></div>
        <div class="absolute bottom-2.5 left-2.5 right-2.5 bg-popover rounded-md px-4 py-3 text-xs overflow-y-auto hidden z-20 pointer-events-auto text-popover-foreground shadow-lg border border-border/15 max-h-[150px] select-text"
            id="node-info"></div>
        <div class="absolute inset-0 bg-black/60 z-[200] hidden justify-center items-center p-4"
            id="expansion-dialog-overlay">
            <div class="bg-popover rounded-lg px-6 py-5 min-w-[340px] max-w-[440px] max-h-[80vh] overflow-y-auto text-popover-foreground shadow-2xl border border-border/15"
                id="expansion-dialog"></div>
        </div>
    </div>

    <script src="assets/graph-view.js"></script>
    <script>
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
    </script>
</body>

</html>
