<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Timeline</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script src="assets/tailwindcss-cdn.js"></script>
    <script src="assets/lucide.js"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
</head>

<body class="antialiased bg-slate-950 text-slate-100 font-inter h-screen flex flex-col overflow-hidden">
    <div class="app flex-1 flex flex-col min-h-0">

        <!-- Topbar -->
        <div class="topbar flex items-center gap-2.5 border-b border-white/10 bg-slate-900/80 px-5 py-4 backdrop-blur">
            <button type="button"
                class="inline-flex items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-100 transition hover:border-white/20 hover:bg-white/10"
                onclick="javaBridge.navigateBack()">
                <i data-lucide="chevron-left" class="h-4 w-4"></i>
                <span>Back</span>
            </button>

            <div class="topbar-sep w-px h-4 bg-white/10 mx-1"></div>

            <button
                class="inline-flex items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-100 transition hover:border-white/20 hover:bg-white/10"
                onclick="zoomBy(0.75)" title="Zoom in (scroll wheel also works)">
                <i data-lucide="zoom-in" class="h-4 w-4"></i>
                Zoom in
            </button>

            <button
                class="inline-flex items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-100 transition hover:border-white/20 hover:bg-white/10"
                onclick="zoomBy(1.35)" title="Zoom out">
                <i data-lucide="zoom-out" class="h-4 w-4"></i>
                Zoom out
            </button>

            <button
                class="inline-flex items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-100 transition hover:border-white/20 hover:bg-white/10"
                onclick="resetView()">
                <i data-lucide="refresh-ccw" class="h-4 w-4"></i>
                Reset
            </button>

            <button
                class="inline-flex items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-100 transition hover:border-white/20 hover:bg-white/10"
                id="clear-filters-btn" onclick="clearAllFilters()" style="display: none;">
                <i data-lucide="eraser" class="h-4 w-4"></i>
                Clear Filters
            </button>

            <div class="topbar-sep w-px h-4 bg-white/10 mx-1"></div>
            <span class="topbar-title ml-1 text-base font-semibold tracking-tight text-slate-50">Historical
                Timeline</span>

            <div class="topbar-meta ml-auto flex items-center gap-3 text-xs text-slate-400">
                <span id="stats">Loading...</span>
                <span id="view-meta"></span>
            </div>
        </div>

        <!-- Main canvas -->
        <div class="canvas-wrap flex-1 overflow-y-auto overflow-x-hidden relative bg-slate-950 pb-12" id="canvas-wrap">
            <canvas id="timeline-canvas"></canvas>
        </div>

        <!-- Minimap -->
        <div class="minimap-shell fixed left-0 right-0 bottom-0 h-11 bg-slate-900/80 border-t border-white/10 z-50 pointer-events-auto"
            id="minimap-shell">
            <span
                class="minimap-label absolute left-2 top-1/2 -translate-y-1/2 text-xs font-semibold uppercase text-slate-400 pointer-events-none z-10">Overview</span>
            <canvas id="minimap-canvas" class="w-full h-full"></canvas>
            <div id="minimap-focus" class="absolute top-0 bottom-0 pointer-events-none"
                style="border:1.5px solid rgba(78,161,255,1); background: rgba(78,161,255,0.15);"></div>
        </div>

    </div>

    <div id="tooltip"
        class="fixed z-50 hidden pointer-events-none rounded-md p-2 max-w-xs text-sm text-slate-100 bg-slate-900/80 border border-white/10 shadow-lg">
    </div>

    <script src="assets/timeline-fast.js"></script>
    <script>
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
    </script>
</body>

</html>
